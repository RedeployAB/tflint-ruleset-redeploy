version: "2"
linters:
  enable:
    - bidichk # Detects dangerous unicode character sequences (trojan source)
    - errchkjson
    - errorlint # Enforces correct error wrapping/comparison (errors.Is/As, %w)
    - exhaustive
    - fatcontext # Detects nested contexts in loops
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gosec # Security linter
    - intrange # Prefers Go 1.22 integer range over classic index loops
    - misspell # Catches common misspellings in comments and strings
    - nolintlint # Flags malformed or unused //nolint directives
    - perfsprint # Prefers cheaper alternatives to fmt.Sprintf/Errorf
    - predeclared # Flags shadowing of predeclared identifiers
    - revive
    - testifylint # Enforces testify assertion best practices
    - unconvert
    - usestdlibvars # Prefers stdlib constants over magic strings
    - wastedassign # Flags assignments whose value is never used
  settings:
    revive:
      # Opinionated by default: every revive rule is on, and only rules that
      # duplicate another linter or are pure noise get switched off below.
      enable-all-rules: true
      rules:
        - name: add-constant # Flags every 0/1/""; goconst covers repeated strings
          disabled: true
        - name: unhandled-error # Duplicates errcheck
          disabled: true
        - name: line-length-limit
          arguments: [120]
        - name: cognitive-complexity
          arguments: [15] # Aligned with gocyclo min-complexity
        - name: cyclomatic
          arguments: [15] # Aligned with gocyclo min-complexity
        - name: enforce-switch-style
          arguments: ["allowNoDefault"] # Still enforces default-last; no empty defaults
        - name: function-length
          exclude: ["TEST"] # Table-driven tests are long by design
    errcheck:
      check-blank: true
    gocritic:
      enabled-checks:
        - ruleguard
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - goconst
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
