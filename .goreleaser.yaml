---
# GoReleaser configuration — https://goreleaser.com
version: 2
env:
  - CGO_ENABLED=0
builds:
  - targets:
      - darwin_amd64
      - darwin_arm64
      - linux_386
      - linux_amd64
      - linux_arm
      - linux_arm64
      - windows_386
      - windows_amd64
    hooks:
      post:
        - mkdir -p ./dist/raw
        - cp "{{ .Path }}" "./dist/raw/{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
archives:
  - id: zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip
    files:
      - none*
changelog:
  sort: asc
  use: github
  # Patterns match the raw commit message; only user-facing types get in.
  filters:
    exclude:
      - '^(chore|ci|docs|refactor|style|test)(\(.+\))?!?:'
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: "New Features"
      regexp: '^feat(\(.+\))?!?:.+$'
      order: 100
    - title: "Bug fixes"
      regexp: '^fix(\(.+\))?!?:.+$'
      order: 200
    - title: "Performance improvements"
      regexp: '^perf(\(.+\))?!?:.+$'
      order: 300
    - title: "Dependency updates"
      regexp: '^deps(\(.+\))?!?:.+$'
      order: 400
    - title: "Build updates"
      regexp: '^build(\(.+\))?!?:.+$'
      order: 500
    - title: Other work
      order: 9999
checksum:
  name_template: 'checksums.txt'
  extra_files:
    - glob: ./dist/raw/*
signs:
  - artifacts: checksum
    cmd: gpg2
    args: [
      "--batch",
      "-u", "{{ .Env.GPG_FINGERPRINT }}",
      "--detach-sign",
      "--output", "${artifact}.sig",
      "${artifact}"
    ]
release:
  github:
    owner: RedeployAB
    name: tflint-ruleset-redeploy
  draft: true
snapshot:
  version_template: "{{ .Tag }}-dev"
